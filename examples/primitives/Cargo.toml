[package]
name = "primitives-example"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
polyengine-dioxus = { path = "../.." }
dioxus = { version = "=0.7.10", default-features = false, features = [
  "macro",
  "html",
  "signals",
  "hooks",
] }
# DioxusLabs' official unstyled primitives. The crates.io `dioxus-primitives`
# is a 0.0.0 placeholder, so this is the git repo, pinned to the same rev the
# vendored stylesheet (harness/primitives.css) was assembled from — the class
# names below and that CSS have to agree.
#
# `default-features = false`: the default feature set pulls renderer- and
# timer-side dependencies this pipeline (plain `cargo build` -> Wasm
# Component, no `dx` CLI, no JS boundary) neither needs nor supports.
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", default-features = false }
