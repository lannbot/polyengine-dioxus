[package]
name = "bench-rows-example"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Default transport is the stream (open + readDirect on the host side);
# `call-transport` builds the same app over the flush(list<u8>, string)
# import instead — mirrors fixtures/surface-probe's feature pattern
# (fixtures/surface-probe/Cargo.toml).
default = []
call-transport = []

[dependencies]
polyengine-dioxus = { path = "../.." }
dioxus = { version = "=0.7.10", default-features = false, features = [
  "macro",
  "html",
  "signals",
  "hooks",
] }
