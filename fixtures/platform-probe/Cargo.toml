[package]
name = "platform-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
polyengine-dioxus = { path = "../..", features = ["eval"] }
dioxus = { version = "=0.7.10", default-features = false, features = [
  "document",
  "router",
  "macro",
  "html",
  "signals",
  "hooks",
] }
serde_json = "1"
