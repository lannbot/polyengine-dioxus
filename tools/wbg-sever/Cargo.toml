[package]
name = "wbg-sever"
version = "0.0.1"
edition = "2021"
publish = false
description = "Sever the wasm-bindgen JS boundary at composition time: replace __wbindgen*/snippet function imports with trapping bodies and strip the describe machinery, so contaminated crate graphs componentize with 'never reached' enforced as a runtime trap."

[dependencies]
walrus = "0.23"
anyhow = "1"

