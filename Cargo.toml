[package]
name = "polyengine-dioxus"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Dioxus renderer for components running on polyengine: batched DOM mutations over a zero-copy stream surface"
publish = false

[dependencies]
# `inter-task-wakeup`: the driver's `run` task parks in `wait_for_work()`
# waiting on a Rust-originating mpsc receiver waker; `handle-event` is a
# *separate* export task that wakes it (Dioxus's scheduler wiring, not a
# WIT-visible waitable). Without this feature, wit-bindgen 0.60's default
# `inter_task_wakeup_disabled` shim panics
# ("Rust task cannot sleep waiting only on Rust-originating events...") the
# moment a cross-task wake actually happens — i.e. on the first event
# dispatch, not at mount. See src/driver.rs's module doc for the parking
# design this feature makes sound.
wit-bindgen = { version = "=0.60.0", features = ["async-spawn", "inter-task-wakeup"] }
dioxus-core = "=0.7.10"
# `event_bubbles` lives in dioxus-core-types (a zero-dep root crate), NOT in
# dioxus-html; it is already in the tree via dioxus-core, so naming it
# directly costs nothing.
dioxus-core-types = "=0.7.10"
dioxus-html = { version = "=0.7.10", default-features = false }
# already in the tree via dioxus-core, so naming it costs nothing; used for
# hot-path interning maps.
rustc-hash = "2"

[dev-dependencies]
# Native-only: `rsx!` for driving a real VirtualDom through the writer in unit
# tests. Dev-dependencies do not enter the wasm32 component build.
dioxus = { version = "=0.7.10", default-features = false, features = [
  "macro",
  "html",
  "signals",
  "hooks",
] }

[workspace]
members = [".", "ssr", "fixtures/surface-probe", "examples/counter", "examples/bench-rows", "examples/todomvc", "examples/components", "examples/primitives"]

# `dioxus-sdk-time` waits by calling the browser's `setTimeout` through
# wasm-bindgen, which on wasm32-wasip2 compiles to off-target stubs that abort
# the instance when called. The fork adds a `wasip3` feature that waits on
# `wasi:clocks/monotonic-clock` instead — an interface this host already
# provides (.deps/polyengine/wasi/src/clocks.ts serves the @0.3 track,
# `waitFor` included). Upstream PR pending; drop this patch once it lands.
#
# Pinned to a rev, not tracking `main`: this is a fork we can push to, so a
# branch reference would let a push there silently change what everyone
# builds — the same reason dioxus-primitives is pinned below and the dioxus
# crates take `=` versions.
[patch.crates-io]
dioxus-sdk-time = { git = "https://github.com/lannbot/dioxus-sdk", rev = "390acec245754a3ad54217a0b625ff121d2c95f2" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
